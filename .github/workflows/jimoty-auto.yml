          - key: alvar_aalto_jp
            search_term: アルヴァ・アアルト
          - key: ilmari_tapiovaara_jp
            search_term: イルマリ・タピオヴァーラ
          - key: louis_poulsen
            search_term: Louis Poulsen
          - key: louis_poulsen_jp
            search_term: ルイスポールセン
          - key: flos
            search_term: Flos
          - key: flos_upper
            search_term: FLOS
          - key: artemide
            search_term: Artemide
          - key: artemide_jp
            search_term: アルテミデ
          - key: foscarini
            search_term: Foscarini
          - key: foscarini_jp
            search_term: フォスカリーニ
          - key: le_klint
            search_term: Le Klint
          - key: le_klint_jp
            search_term: レ・クリント
          - key: yamagiwa
            search_term: ヤマギワ
          - key: isamu_noguchi_jp
            search_term: イサム・ノグチ
          - key: akari
            search_term: AKARI
          - key: art_work_studio
            search_term: ART WORK STUDIO
          - key: art_work_studio_jp
            search_term: アートワークスタジオ
          - key: balumuda
            search_term: バルミューダ
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ARTIFACT_NAME="jimoty-state-${{ matrix.key }}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1"
          URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API" | jq -r '.artifacts[0].archive_download_url // empty')
          if [ -n "$URL" ]; then
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$URL" -o state.zip || true
            unzip -o state.zip -d . 2>/dev/null || true
          fi
          test -f "state_${{ matrix.key }}.json" || echo '{"notified_urls":[]}' > "state_${{ matrix.key }}.json"

      - name: Run search repeatedly
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JIMOTY_SEARCH_TERM: ${{ matrix.search_term }}
          JIMOTY_STATE_PATH: state_${{ matrix.key }}.json
          JIMOTY_RESULT_PATH: result_${{ matrix.key }}.json
        run: |
          set -u
          for i in $(seq 1 11); do
            echo "===== Jimoty check ${i}/11: ${JIMOTY_SEARCH_TERM} at $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
            if ! python jimoty_one_search.py; then
              echo "Jimoty check ${i} failed for ${JIMOTY_SEARCH_TERM}; continuing to the next check."
            fi
            if [ "$i" -lt 11 ]; then
              sleep 290
            fi
          done

      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jimoty-state-${{ matrix.key }}
          path: state_${{ matrix.key }}.json
          retention-days: 7

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jimoty-result-${{ matrix.key }}
          path: result_${{ matrix.key }}.json
          retention-days: 7
