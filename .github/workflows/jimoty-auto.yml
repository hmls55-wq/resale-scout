name: Jimoty Auto Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub schedule is only a launcher. One run performs an actual 5-minute loop.
    - cron: "7 * * * *"
      timezone: "Asia/Tokyo"

concurrency:
  group: jimoty-auto-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Jimoty database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ARTIFACT_NAME="jimoty-global-db"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1"
          URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API" | jq -r '.artifacts[0].archive_download_url // empty')
          if [ -n "$URL" ]; then
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$URL" -o state.zip || true
            unzip -o state.zip -d . 2>/dev/null || true
          fi
          test -f jimoty_db.json || echo '{"initialized":false,"seen_urls":[],"items":{}}' > jimoty_db.json

      - name: Run Jimoty collector every 5 minutes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JIMOTY_STATE_PATH: jimoty_db.json
          JIMOTY_RULES_PATH: notification_rules.json
          JIMOTY_RESULT_PATH: jimoty_monitor_result.json
          JIMOTY_MAX_PAGES: 10
          JIMOTY_DETAIL_FETCH_LIMIT: 100
          JIMOTY_DISTANCE_KM: 50
          JIMOTY_CENTER_LAT: 35.1681
          JIMOTY_CENTER_LNG: 136.8734
        run: |
          set -u
          for i in $(seq 1 11); do
            echo "===== Jimoty global check ${i}/11 at $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
            if ! python jimoty_monitor.py; then
              echo "Jimoty global check ${i} failed; continuing to the next check."
            fi
            if [ "$i" -lt 11 ]; then
              sleep 290
            fi
          done

      - name: Upload Jimoty database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jimoty-global-db
          path: jimoty_db.json
          retention-days: 7

      - name: Upload latest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jimoty-global-result
          path: jimoty_monitor_result.json
          retention-days: 7
