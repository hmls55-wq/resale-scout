name: Jimoty Auto Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "3-59/5 * * * *"

concurrency:
  group: jimoty-auto-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start timer
        run: date +%s > .jimoty_start_epoch

      - name: Restore Jimoty database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ARTIFACT_NAME="jimoty-global-db"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1"
          URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API" | jq -r '.artifacts[0].archive_download_url // empty')
          if [ -n "$URL" ]; then
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$URL" -o state.zip || true
            unzip -o state.zip -d . 2>/dev/null || true
          fi
          test -f jimoty_db.json || echo '{"initialized":false,"seen_urls":[],"items":{},"pending_items":{}}' > jimoty_db.json

      - name: Run Jimoty all-category scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JIMOTY_STATE_PATH: jimoty_db.json
          JIMOTY_RULES_PATH: notification_rules.json
          JIMOTY_RESULT_PATH: jimoty_monitor_result.json
          JIMOTY_BASE_URLS: https://jmty.jp/aichi/sale,https://jmty.jp/gifu/sale,https://jmty.jp/mie/sale,https://jmty.jp/shiga/sale
          JIMOTY_BASE_URL: https://jmty.jp/aichi/sale
          JIMOTY_MAX_PAGES: 2
          JIMOTY_DETAIL_FETCH_LIMIT: 60
          JIMOTY_DETAIL_FETCH_WORKERS: 10
          JIMOTY_HTTP_TIMEOUT: 15
          JIMOTY_DISTANCE_KM: 50
          JIMOTY_CENTER_LAT: 35.1681
          JIMOTY_CENTER_LNG: 136.8734
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path("jimoty_monitor.py")
          s = p.read_text(encoding="utf-8")

          # Keep the checked-in source authoritative; normalize the legacy
          # detail-description extraction block when necessary.
          old = '''        descriptions = []
          patterns = [
              r'<meta[^>]+property=["\\']og:description["\\'][^>]+content=["\\'](.*?)["\\']',
              r'<meta[^>]+name=["\\']description["\\'][^>]+content=["\\'](.*?)["\\']',
              r'<meta[^>]+content=["\\'](.*?)["\\']\\s+property=["\\']og:description["\\']',
              r'<meta[^>]+content=["\\'](.*?)["\\']\\s+name=["\\']description["\\']',
          ]
          for pat in patterns:
              descriptions.extend(clean(x) for x in re.findall(pat, page, re.I | re.S))
          item["description"] = (max(descriptions, key=len) if descriptions else clean(page))[:12000]
          '''
          new = '''        from html.parser import HTMLParser

          class _MetaDescriptionParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.descriptions = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "meta":
                      return
                  attrs = dict(attrs)
                  key = (attrs.get("property") or attrs.get("name") or "").lower()
                  if key in ("og:description", "description") and attrs.get("content"):
                      self.descriptions.append(attrs["content"])

          parser = _MetaDescriptionParser()
          parser.feed(page)
          descriptions = [clean(x) for x in parser.descriptions if clean(x)]
          item["description"] = (max(descriptions, key=len) if descriptions else clean(page))[:12000]
          '''
          if old in s:
              s = s.replace(old, new)

          marker = 'def match_rules(item, rules):\n'
          if marker not in s:
              raise RuntimeError("match_rules marker not found")

          helper = r'''CITY_COORDS = {
              "名古屋市": (35.1815, 136.9066), "清須市": (35.1990, 136.8520),
              "北名古屋市": (35.2450, 136.8700), "豊山町": (35.2360, 136.9100),
              "春日井市": (35.2470, 136.9720), "小牧市": (35.2910, 136.9120),
              "稲沢市": (35.2490, 136.7800), "あま市": (35.2000, 136.7900),
              "津島市": (35.1770, 136.7410), "弥富市": (35.1170, 136.7240),
              "蟹江町": (35.1300, 136.8200), "飛島村": (35.0800, 136.8200),
              "大治町": (35.1800, 136.8200), "大府市": (35.0070, 136.9630),
              "東海市": (35.0200, 136.9020), "豊明市": (35.0510, 137.0200),
              "日進市": (35.1320, 137.0390), "長久手市": (35.1840, 137.0480),
              "瀬戸市": (35.2230, 137.0840), "尾張旭市": (35.2160, 137.0350),
              "岩倉市": (35.2790, 136.8710), "江南市": (35.3310, 136.8710),
              "犬山市": (35.3790, 136.9440), "一宮市": (35.3030, 136.8020),
              "羽島市": (35.3190, 136.7030), "桑名市": (35.0600, 136.6830),
              "木曽岬町": (35.0730, 136.7360), "海津市": (35.2200, 136.6300),
              "刈谷市": (34.9900, 137.0020), "知立市": (35.0000, 137.0500),
              "みよし市": (35.0900, 137.0700), "東郷町": (35.0900, 137.0600),
              "扶桑町": (35.3600, 136.9100), "大口町": (35.3300, 136.9100),
          }

          def city_distance_km(city):
              point = CITY_COORDS.get(city)
              if not point:
                  return None
              lat1, lon1 = map(float, (CENTER_LAT, CENTER_LNG))
              lat2, lon2 = point
              import math
              p = math.pi / 180.0
              x = (lon2 - lon1) * p * math.cos((lat1 + lat2) * p / 2.0) * 6371.0
              y = (lat2 - lat1) * p * 6371.0
              return math.sqrt(x * x + y * y)

          def extract_city(text):
              haystack = clean(text or "")
              names = sorted(CITY_COORDS, key=len, reverse=True)
              for city in names:
                  if city in haystack:
                      return city
              return None

          def apply_rank_metadata(rules):
              for rule in rules:
                  if rule.get("name") in ("IKEA", "無印良品"):
                      rule["rank"] = "C"
                      rule["max_distance_km"] = 25
              return rules

          def _match_rules_with_distance(item, rules):
              text = f"{item.get('title', '')}\n{item.get('description', '')}"
              matches = []
              for rule in apply_rank_metadata(rules):
                  if rule.get("enabled", True) is False:
                      continue
                  for keyword in rule.get("keywords", []):
                      if keyword_match(text, keyword):
                          max_distance = rule.get("max_distance_km")
                          distance = item.get("distance_km")
                          if max_distance is not None:
                              if distance is None or distance > max_distance:
                                  break
                          matches.append({"name": rule.get("name", keyword), "keyword": keyword, "rank": rule.get("rank"), "distance_km": round(distance, 1) if distance is not None else None})
                          break
              return matches

          '''
          if 'CITY_COORDS = {' not in s:
              s = s.replace(marker, helper + marker, 1)

          start = s.index('def match_rules(item, rules):')
          end = s.index('\ndef fetch_detail(item):', start)
          s = s[:start] + 'def match_rules(item, rules):\n    return _match_rules_with_distance(item, rules)\n' + s[end:]

          s = s.replace('        page = fetch(item["url"])\n', '        card_text = item.get("description", "")\n        item["location_city"] = extract_city(card_text)\n        item["distance_km"] = city_distance_km(item.get("location_city"))\n        page = fetch(item["url"])\n', 1)
          s = s.replace('        start = max(0, m.start() - 3000)\n        end = min(len(page_html), m.start() + 15000)\n', '        start = max(0, m.start() - 500)\n        end = min(len(page_html), m.start() + 5000)\n', 1)

          # Merge supplemental product/series/model keywords.
          rules_path = Path("notification_rules.json")
          product_path = Path("product_keywords.json")
          if product_path.exists():
              base = json.loads(rules_path.read_text(encoding="utf-8"))
              extra = json.loads(product_path.read_text(encoding="utf-8"))
              base_rules = base.setdefault("rules", [])
              for extra_rule in extra.get("rules", []):
                  target = next((r for r in base_rules if r.get("name") == extra_rule.get("name")), None)
                  if target is None:
                      base_rules.append(extra_rule)
                  else:
                      target["keywords"] = list(dict.fromkeys(list(target.get("keywords", [])) + list(extra_rule.get("keywords", []))))
              base["version"] = max(int(base.get("version", 0)), int(extra.get("version", 0)) + 6)
              rules_path.write_text(json.dumps(base, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # IKEA: only FROSTA / フロスタ.
          # KOIZUMI: remove from all rules.
          # YAMADA: remove from all rules (requested: ヤマダ / yamada).
          # HAY: keep the English brand keyword HAY, but remove the katakana ヘイ.
          final_rules = json.loads(rules_path.read_text(encoding="utf-8"))
          for rule in final_rules.get("rules", []):
              if rule.get("name") == "IKEA":
                  rule["keywords"] = ["FROSTA", "フロスタ"]
              if rule.get("name") == "HAY":
                  rule["keywords"] = [
                      keyword for keyword in rule.get("keywords", [])
                      if str(keyword).strip() != "ヘイ"
                  ]
          blocked = {"koizumi", "コイズミ", "yamada", "ヤマダ"}
          for rule in final_rules.get("rules", []):
              rule["keywords"] = [
                  keyword for keyword in rule.get("keywords", [])
                  if str(keyword).strip().lower() not in blocked
              ]
          rules_path.write_text(json.dumps(final_rules, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          p.write_text(s, encoding="utf-8")
          PY
          python jimoty_monitor.py

      - name: Upload Jimoty database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jimoty-global-db
          path: jimoty_db.json
          retention-days: 7

      - name: Upload latest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jimoty-global-result
          path: jimoty_monitor_result.json
          retention-days: 7

      - name: Chain next 5-minute run
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          START=$(cat .jimoty_start_epoch 2>/dev/null || date +%s)
          NOW=$(date +%s)
          ELAPSED=$((NOW-START))
          WAIT=$((300-ELAPSED))
          if [ "$WAIT" -gt 0 ]; then sleep "$WAIT"; fi
          gh workflow run jimoty-auto.yml --repo "$GITHUB_REPOSITORY" --ref main
