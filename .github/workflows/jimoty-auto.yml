name: Jimoty Auto Monitor

on:
  workflow_dispatch:
  schedule:
    # Backup scheduler. The normal 5-minute loop is self-chained below.
    - cron: "3-59/5 * * * *"

concurrency:
  group: jimoty-auto-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start timer
        run: date +%s > .jimoty_start_epoch

      - name: Restore Jimoty database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ARTIFACT_NAME="jimoty-global-db"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1"
          URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API" | jq -r '.artifacts[0].archive_download_url // empty')
          if [ -n "$URL" ]; then
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$URL" -o state.zip || true
            unzip -o state.zip -d . 2>/dev/null || true
          fi
          test -f jimoty_db.json || echo '{"initialized":false,"seen_urls":[],"items":{},"pending_items":{}}' > jimoty_db.json

      - name: Run Jimoty all-category scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JIMOTY_STATE_PATH: jimoty_db.json
          JIMOTY_RULES_PATH: notification_rules.json
          JIMOTY_RESULT_PATH: jimoty_monitor_result.json
          JIMOTY_BASE_URLS: https://jmty.jp/aichi/sale,https://jmty.jp/gifu/sale,https://jmty.jp/mie/sale,https://jmty.jp/shiga/sale
          JIMOTY_BASE_URL: https://jmty.jp/aichi/sale
          JIMOTY_MAX_PAGES: 2
          JIMOTY_DETAIL_FETCH_LIMIT: 60
          JIMOTY_DETAIL_FETCH_WORKERS: 10
          JIMOTY_HTTP_TIMEOUT: 15
          JIMOTY_DISTANCE_KM: 50
          JIMOTY_CENTER_LAT: 35.1681
          JIMOTY_CENTER_LNG: 136.8734
        run: |
          # Runtime guard: replace any malformed Detail priority print line safely.
          python - <<'PY'
          from pathlib import Path
          p = Path("jimoty_monitor.py")
          lines = p.read_text(encoding="utf-8").splitlines()
          fixed = []
          for line in lines:
              if "Detail priority:" in line and "print(" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  line = indent + 'print(f"Detail priority: fresh={min(len(fresh_new_urls), DETAIL_FETCH_LIMIT)}, old_pending={max(0, len(pending_urls) - min(len(fresh_new_urls), DETAIL_FETCH_LIMIT))}")'
              fixed.append(line)
          p.write_text("\n".join(fixed) + "\n", encoding="utf-8")
          PY
          python jimoty_monitor.py

      - name: Upload Jimoty database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jimoty-global-db
          path: jimoty_db.json
          retention-days: 7

      - name: Upload latest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jimoty-global-result
          path: jimoty_monitor_result.json
          retention-days: 7

      - name: Chain next 5-minute run
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          START=$(cat .jimoty_start_epoch 2>/dev/null || date +%s)
          NOW=$(date +%s)
          ELAPSED=$((NOW-START))
          WAIT=$((300-ELAPSED))
          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting ${WAIT}s so the next run starts about 5 minutes after this run began."
            sleep "$WAIT"
          fi
          echo "Dispatching the next Jimoty Auto Monitor run..."
          gh workflow run jimoty-auto.yml --repo "$GITHUB_REPOSITORY" --ref main
