name: Area Portal Test
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Test Jimoty area portal')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python test_area_portal.py
