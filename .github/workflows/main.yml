name: Resell Scout

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Resell Scout
        run: python scout.py

      - name: Check Mercari sold-market prices
        if: success()
        run: python mercari_market.py

      - name: Build Mercari verification report
        if: always()
        run: python build_verification_report.py

      - name: Show generated reports
        if: always()
        run: |
          echo "=== generated files ==="
          ls -lah resell_report.md resell_candidates.json verification_report.md mercari_market.json

      - name: Upload scout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resell-scout-report
          path: |
            resell_report.md
            resell_candidates.json
            verification_report.md
            mercari_market.json
          if-no-files-found: error
          retention-days: 7
