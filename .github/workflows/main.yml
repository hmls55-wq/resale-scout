name: Resell Scout

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: resell-scout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run Resell Scout
        run: python scout.py

      - name: Scan additional resale categories
        if: success()
        run: python scout_extra.py

      - name: Enrich Jimoty candidates
        if: success()
        run: python enrich_jmty.py

      - name: Normalize market query titles
        if: success()
        run: python prepare_market_candidates.py

      - name: Check Mercari sold-market prices
        if: success()
        run: python mercari_market.py

      - name: Improve Mercari title matching
        if: success()
        run: python improve_market_similarity.py

      - name: Calculate net resale profit
        if: success()
        run: python calculate_profit.py

      - name: Rank resale opportunities
        if: success()
        run: python rank_opportunities.py

      - name: Build Mercari verification report
        if: always()
        run: python build_verification_report.py

      - name: Show generated reports
        if: always()
        run: |
          echo "=== generated files ==="
          ls -lah resell_report.md resell_candidates.json verification_report.md mercari_market.json profit_report.md profit_candidates.json opportunity_report.md opportunity_candidates.json mercari_debug.* 2>/dev/null || true

      - name: Upload scout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resell-scout-report
          path: |
            resell_report.md
            resell_candidates.json
            verification_report.md
            mercari_market.json
            profit_report.md
            profit_candidates.json
            opportunity_report.md
            opportunity_candidates.json
            mercari_debug.txt
            mercari_debug.png
          if-no-files-found: warn
          retention-days: 7
