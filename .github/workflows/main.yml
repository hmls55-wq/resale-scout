name: Resell Scout

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run Resell Scout
        run: python scout.py

      - name: Prepare Mercari market checker
        if: success()
        run: python patch_mercari_region.py

      - name: Capture Mercari API response for debugging
        if: success()
        run: python patch_mercari_api_debug.py

      - name: Check Mercari sold-market prices
        if: success()
        run: python mercari_market.py

      - name: Build Mercari verification report
        if: always()
        run: python build_verification_report.py

      - name: Show generated reports
        if: always()
        run: |
          echo "=== generated files ==="
          ls -lah resell_report.md resell_candidates.json verification_report.md mercari_market.json mercari_debug.* 2>/dev/null || true

      - name: Upload scout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resell-scout-report
          path: |
            resell_report.md
            resell_candidates.json
            verification_report.md
            mercari_market.json
            mercari_debug.txt
            mercari_debug.png
          if-no-files-found: warn
          retention-days: 7
