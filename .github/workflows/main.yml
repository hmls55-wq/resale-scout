name: Resell Scout

on:
  # 旧Jimoty監視は自動実行を停止。
  # 現在のJimoty監視は jimoty-auto.yml に一本化する。
  workflow_dispatch:

concurrency:
  group: resell-scout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous watcher state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=resell-scout-state&per_page=1"
          URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API" | jq -r '.artifacts[0].archive_download_url // empty')
          if [ -n "$URL" ]; then
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$URL" -o state.zip || true
            unzip -o state.zip -d . 2>/dev/null || true
          fi
          test -f watch_state.json || echo '{"seen_urls":[]}' > watch_state.json

      - name: Isolate item titles before matching
        run: python patch_watchlist_match.py

      - name: Run new-listing watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # [SCAN30] commit message enables a one-time 30-page verification scan.
          SCAN_PAGES: ${{ github.event_name == 'workflow_dispatch' && '30' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[SCAN30]')) && '30' || '5' }}
        run: python watch_new_listings.py

      - name: Upload watcher state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resell-scout-state
          path: watch_state.json
          retention-days: 7

      - name: Upload new matches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resell-scout-new-matches
          path: new_matches.json
          retention-days: 7
