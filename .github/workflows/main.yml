name: Resell Scout

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Resell Scout
        run: python scout.py

      - name: Upload scout report
        uses: actions/upload-artifact@v4
        with:
          name: resell-scout-report
          path: |
            resell_report.md
            resell_candidates.json
          if-no-files-found: error
          retention-days: 7
