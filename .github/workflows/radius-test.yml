name: Radius Search Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Radius test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run radius search test
        run: python test_radius_search.py
