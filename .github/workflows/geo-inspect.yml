name: Geo Inspect
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Inspect Jimoty geo')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python inspect_jmty_geo.py
