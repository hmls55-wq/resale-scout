name: Jimoty Discord Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Jimoty search and Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JIMOTY_SEARCH_TERM: "IKEA"
          JIMOTY_TEST_NOTIFY: "1"
        run: python jimoty_one_search.py
